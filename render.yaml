# render.yaml — the deployment spec ("blueprint") for Render's one-click
# Deploy button. This file is why nobody has to pick settings in a dashboard:
# the choices live here, in the repo, versioned like everything else.
#
#   type: web          a service that stays running and answers requests
#   runtime: docker    build from the Dockerfile (the packing slip)
#   dockerContext: .   build from the repo root, so scripts/ is included
#   plan: free         Render's free tier (sleeps after ~15 min idle;
#                      first request of the day takes up to a minute)
#   healthCheckPath    Render pings /health to know the engine is alive —
#                      the same endpoint the web page's green dot watches
#   autoDeployTrigger  every push to GitHub redeploys automatically

services:
  - type: web
    name: star-glass-engine
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
