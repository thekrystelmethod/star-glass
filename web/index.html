<!doctype html>
<html lang="en" data-theme="paperlab">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="description" content="StarGlass — deterministic natal-chart mathematics and depth-psychological interpretation." />
    <title>StarGlass — the interpretation engine</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('starglass-theme');
          if (saved) document.documentElement.dataset.theme = saved;
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
